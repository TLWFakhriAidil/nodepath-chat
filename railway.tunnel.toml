# Railway configuration for SSH tunnel service
# This file configures the SSH tunnel container for secure MySQL connection

[build]
# Use the SSH tunnel Docker image
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.tunnel"

[deploy]
# Railway deployment settings
startCommand = "/entrypoint.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Environment variables for SSH tunnel
[env]
# SSH server configuration (replace with your SSH server details)
TUNNEL_HOST = "your-ssh-server.com"  # Replace with your SSH jump server
TUNNEL_PORT = "22"
TUNNEL_USER = "your-ssh-user"        # Replace with your SSH username

# Local tunnel port
LOCAL_PORT = "3307"

# Remote MySQL server details
REMOTE_HOST = "159.89.198.71"
REMOTE_PORT = "3306"

# SSH key path (will be set via Railway secrets)
SSH_KEY = "/app/ssh-keys/id_rsa"

# Health check settings
HEALTH_CHECK_INTERVAL = "30"
HEALTH_CHECK_TIMEOUT = "10"

[networking]
# Expose the tunnel port for internal Railway networking
ports = [3307]

# Railway private networking
privateNetworking = true

[resources]
# Resource allocation for the tunnel service
memory = "256Mi"
cpu = "0.25"

[scaling]
# Keep only one instance of the tunnel
minReplicas = 1
maxReplicas = 1

[healthCheck]
# Health check configuration
path = "/health"
port = 3307
intervalSeconds = 30
timeoutSeconds = 10
failureThreshold = 3

[secrets]
# SSH private key should be added as Railway secret
# Add your SSH private key content to Railway environment as SSH_PRIVATE_KEY
# The Dockerfile will handle placing it in the correct location
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Analytics API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f4f4f4;
            border: 1px solid #ddd;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .error {
            background-color: #ffcccc;
            border-color: #ff0000;
        }
        .success {
            background-color: #ccffcc;
            border-color: #00ff00;
        }
    </style>
</head>
<body>
    <h1>Test Analytics API</h1>
    
    <p>This page tests the analytics API endpoint to diagnose why data is not showing in the sidebar.</p>
    
    <button onclick="testAnalytics()">Test Analytics API</button>
    <button onclick="testWithAuth()">Test with Authentication</button>
    <button onclick="testDataTable()">Test Data Table API</button>
    
    <div id="result"></div>

    <script>
        const resultDiv = document.getElementById('result');
        
        async function testAnalytics() {
            resultDiv.textContent = 'Testing analytics API...';
            resultDiv.className = '';
            
            try {
                // Test the analytics endpoint
                const response = await fetch('/api/ai-whatsapp/ai/analytics', {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });
                
                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    data = responseText;
                }
                
                resultDiv.textContent = `Status: ${response.status} ${response.statusText}\n\n`;
                resultDiv.textContent += `Response:\n${typeof data === 'object' ? JSON.stringify(data, null, 2) : data}`;
                
                if (response.ok) {
                    resultDiv.className = 'success';
                    
                    // Check if we got actual data
                    if (data && data.totalConversations !== undefined) {
                        resultDiv.textContent += '\n\n✅ Analytics API is working!';
                        resultDiv.textContent += `\n\nSummary:`;
                        resultDiv.textContent += `\n- Total Conversations: ${data.totalConversations}`;
                        resultDiv.textContent += `\n- AI Active: ${data.aiActiveConversations}`;
                        resultDiv.textContent += `\n- Human Takeovers: ${data.humanTakeovers}`;
                        resultDiv.textContent += `\n- Unique Devices: ${data.uniqueDevices}`;
                    }
                } else {
                    resultDiv.className = 'error';
                    resultDiv.textContent += '\n\n❌ API returned an error';
                }
                
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
                resultDiv.className = 'error';
            }
        }
        
        async function testWithAuth() {
            resultDiv.textContent = 'Testing with authentication...\n\n';
            resultDiv.className = '';
            
            try {
                // First, check if we're authenticated
                const authResponse = await fetch('/api/auth/user', {
                    credentials: 'include'
                });
                
                if (!authResponse.ok) {
                    resultDiv.textContent += '❌ Not authenticated. Please log in first.\n';
                    resultDiv.className = 'error';
                    return;
                }
                
                const user = await authResponse.json();
                resultDiv.textContent += `✅ Authenticated as: ${user.email || 'Unknown'}\n\n`;
                
                // Now test analytics
                await testAnalytics();
                
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
                resultDiv.className = 'error';
            }
        }
        
        async function testDataTable() {
            resultDiv.textContent = 'Testing data table API...';
            resultDiv.className = '';
            
            try {
                const response = await fetch('/api/ai-whatsapp/ai-whatsapp/data?limit=5', {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });
                
                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    data = responseText;
                }
                
                resultDiv.textContent = `Status: ${response.status} ${response.statusText}\n\n`;
                resultDiv.textContent += `Response:\n${typeof data === 'object' ? JSON.stringify(data, null, 2) : data}`;
                
                if (response.ok) {
                    resultDiv.className = 'success';
                    if (data && data.data) {
                        resultDiv.textContent += `\n\n✅ Data table API is working!`;
                        resultDiv.textContent += `\n\nFound ${data.data.length} records`;
                    }
                } else {
                    resultDiv.className = 'error';
                    resultDiv.textContent += '\n\n❌ API returned an error';
                }
                
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
                resultDiv.className = 'error';
            }
        }
        
        // Test on page load
        window.onload = () => {
            console.log('Test page loaded. Click a button to test the API.');
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySQL API Connection Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    button {
      padding: 10px 15px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 10px;
    }
    button:hover {
      background-color: #45a049;
    }
    pre {
      background-color: #f5f5f5;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
    }
    .error {
      color: red;
    }
    .success {
      color: green;
    }
  </style>
</head>
<body>
  <h1>MySQL API Connection Test</h1>
  <p>This page tests the connection to the MySQL API endpoint with improved error handling.</p>
  
  <div>
    <button id="testBtn">Test Connection</button>
    <button id="clearBtn">Clear Results</button>
  </div>
  
  <h2>Results:</h2>
  <div id="results">
    <p>Click "Test Connection" to begin...</p>
  </div>
  
  <script>
    document.getElementById('testBtn').addEventListener('click', testConnection);
    document.getElementById('clearBtn').addEventListener('click', () => {
      document.getElementById('results').innerHTML = '<p>Results cleared...</p>';
    });
    
    async function testConnection() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<p>Testing connection...</p>';
      
      try {
        // Test direct connection to the MySQL API
        const response = await fetch('https://nodepath-chat-production.up.railway.app/mysql-api.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            query: 'SELECT 1 as test',
            params: [],
            config: {
              host: '159.89.198.71',
              port: 3306,
              user: 'admin_aqil',
              password: 'admin_aqil',
              database: 'admin_railway'
            }
          })
        });
        
        // Get response as text first to handle potential JSON parsing issues
        const responseText = await response.text();
        console.log('Raw API response:', responseText);
        
        // Display raw response
        resultsDiv.innerHTML += `<h3>Raw Response:</h3><pre>${responseText}</pre>`;
        
        // Check if response is empty
        if (!responseText) {
          resultsDiv.innerHTML += `<p class="error">Error: Empty response from server</p>`;
          return;
        }
        
        // Try to parse the response as JSON
        try {
          const jsonResult = JSON.parse(responseText);
          resultsDiv.innerHTML += `<h3>Parsed JSON Response:</h3><pre>${JSON.stringify(jsonResult, null, 2)}</pre>`;
          
          if (jsonResult.success) {
            resultsDiv.innerHTML += `<p class="success">Connection successful!</p>`;
          } else {
            resultsDiv.innerHTML += `<p class="error">Error: ${jsonResult.error || 'Unknown error'}</p>`;
          }
        } catch (parseError) {
          console.error('Failed to parse JSON response:', responseText);
          resultsDiv.innerHTML += `<p class="error">Failed to parse response: ${parseError.message}</p>`;
        }
      } catch (error) {
        resultsDiv.innerHTML += `<p class="error">Error: ${error.message}</p>`;
      }
    }
  </script>
</body>
</html>
